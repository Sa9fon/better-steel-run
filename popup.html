<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Better Steel Run</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap">
  <style>
    :root {
      --bg: #150d22;
      --panel: #221434;
      --line: #452a66;
      --gold: #f5c542;
      --gold-deep: #c8901a;
      --sunset: #ff7a3d;
      --pink: #e84aa0;
      --violet: #6a2fb0;
      --text: #f3e9ff;
      --muted: #b9a6d3;
      --ok: #7ee0a1;
      --err: #ff8a8a;
      --display: 'Anton', Impact, 'Arial Narrow Bold', sans-serif;
    }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }

    body {
      width: 300px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px 'Inter', system-ui, sans-serif;
    }

    /* Header: desert sunset, spinning steel ball, menacing ゴゴゴ */
    header {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 34px 18px 14px;
      background: linear-gradient(135deg, var(--sunset), var(--pink) 55%, var(--violet));
    }
    header::after { /* dune silhouette */
      content: '';
      position: absolute;
      inset: auto -10% -18px -10%;
      height: 34px;
      background: var(--bg);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }
    .ball {
      flex: none;
      width: 44px;
      height: 44px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .45));
      animation: spin 2.4s linear infinite;
    }
    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font: 24px/0.95 var(--display);
      letter-spacing: .5px;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 2px 2px 0 #3a1552, -1px -1px 0 #3a1552, 1px -1px 0 #3a1552, -1px 1px 0 #3a1552;
      transform: skewX(-8deg);
    }
    h1 span { color: #fff; }
    .tag {
      position: relative;
      z-index: 1;
      margin: 4px 0 0;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      opacity: .9;
    }
    .menacing { /* stacked vertically down the right edge, manga-style */
      position: absolute;
      right: 8px;
      top: 6px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      font: 900 20px 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Hiragino Sans', sans-serif; /* Anton has no kana */
      color: #2a0f3d;
      text-shadow: 1px 1px 0 rgba(245, 197, 66, .6);
      line-height: 1;
    }
    .menacing b {
      display: inline-block;
      font-weight: normal;
      animation: menace 1.2s ease-in-out infinite;
    }
    .menacing b:nth-child(2) { animation-delay: .2s; font-size: 17px; }
    .menacing b:nth-child(3) { animation-delay: .4s; font-size: 13px; }

    main { padding: 4px 14px 14px; }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card h2 {
      margin: 0 0 10px;
      font: 14px var(--display);
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold);
    }

    label { display: block; margin-bottom: 10px; color: var(--muted); font-weight: 600; font-size: 12px; }
    select, input {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 7px 8px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
    }
    select:focus, input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
    .hint { display: block; margin-top: 3px; font-weight: 400; font-size: 11px; opacity: .8; }

    button {
      display: block;
      width: 100%;
      padding: 9px;
      border: 0;
      border-radius: 6px;
      font: 15px var(--display);
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      color: #2a1300;
      background: linear-gradient(180deg, var(--gold), var(--gold-deep));
      box-shadow: 0 3px 0 #7a4f0a;
      transition: transform .08s, box-shadow .08s, filter .15s;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 #7a4f0a; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    button.secondary {
      margin-top: 8px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      box-shadow: none;
    }
    button.secondary:hover { border-color: var(--gold); color: var(--gold); }

    /* "Outro starts now" as the To Be Continued arrow */
    button.tbc {
      padding: 10px 10px 10px 30px;
      border-radius: 0;
      color: #f4ecd0;
      background: linear-gradient(180deg, #7a6a3a, #54471f);
      box-shadow: none;
      clip-path: polygon(0 50%, 22px 0, 100% 0, 100% 100%, 22px 100%);
    }
    button.tbc:active { transform: translateX(-2px); }

    #confirm {
      margin-top: 10px;
      padding: 10px;
      border: 1px dashed var(--gold);
      border-radius: 8px;
    }
    #confirm p { margin: 0 0 8px; line-height: 1.4; }

    #status { min-height: 1.2em; margin-top: 2px; font-size: 12px; font-weight: 600; text-align: center; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes menace {
      0%, 100% { transform: translate(0, 0) rotate(-6deg); }
      50% { transform: translate(-2px, 2px) rotate(6deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ball, .menacing b { animation: none; }
    }
  </style>
</head>
<body>
  <header>
    <svg class="ball" viewBox="0 0 44 44" aria-hidden="true">
      <defs>
        <radialGradient id="steel" cx="35%" cy="30%" r="75%">
          <stop offset="0" stop-color="#fffbe8"/>
          <stop offset=".35" stop-color="#f5c542"/>
          <stop offset="1" stop-color="#8a5a0c"/>
        </radialGradient>
      </defs>
      <circle cx="22" cy="22" r="20" fill="url(#steel)" stroke="#3a1552" stroke-width="2"/>
      <path d="M22 22 a2 2 0 0 1 4 0 a4 4 0 0 1 -8 0 a6 6 0 0 1 12 0 a8 8 0 0 1 -16 0 a10 10 0 0 1 20 0"
            fill="none" stroke="#3a1552" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>Better <span>Steel</span> Run</h1>
      <p class="tag">Your ending theme, every episode</p>
    </div>
    <div class="menacing" aria-hidden="true"><b>ゴ</b><b>ゴ</b><b>ゴ</b></div>
  </header>

  <main>
    <section class="card">
      <h2>Ending theme</h2>
      <label>Track
        <select id="track">
          <option value="sounds/horse.mp3">A Horse With No Name</option>
          <option value="sounds/chain.mp3">The Chain</option>
          <option value="custom">Custom Local File</option>
        </select>
      </label>

      <label id="fileRow" hidden>MP3 file
        <input type="file" id="file" accept="audio/mpeg,.mp3">
      </label>

      <label>Seconds before end
        <input type="number" id="offset" min="0" step="0.5" value="0">
        <span class="hint">Fallback when not auto-detected · 0 = off</span>
      </label>

      <button id="save">Save</button>
    </section>

    <section class="card">
      <h2>Mark the ending</h2>
      <button id="mark" class="tbc">Outro starts now</button>
      <button id="end" class="secondary">Outro ends now</button>
      <div id="confirm" hidden>
        <p id="confirmText"></p>
        <button id="send">Share on AniSkip</button>
        <button id="cancel" class="secondary">Cancel</button>
      </div>
    </section>

    <div id="status" role="status"></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
